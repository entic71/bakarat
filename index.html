<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Quantum Shield vs Mythos AI 시뮬레이터</title>
    <style>
        :root { --bg: #0f172a; --text: #f8fafc; --accent: #deff9a; --danger: #f43f5e; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 40px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h1, h2 { color: var(--accent); }
        .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .box { padding: 15px; border-radius: 8px; background: #0f172a; border-left: 4px solid var(--accent); }
        .controls { margin: 20px 0; display: flex; gap: 20px; align-items: center; }
        button { background: var(--accent); color: #000; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.8; }
        .log-area { height: 250px; overflow-y: auto; background: #000; color: #10b981; padding: 15px; font-family: monospace; border-radius: 8px; font-size: 13px; }
        .stat { font-size: 24px; font-weight: bold; color: var(--accent); }
        .error { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Quantum Shield vs Mythos AI</h1>
    <p>물리학 II 양자 역학 원리를 이용한 보안성 검증 시뮬레이터</p>

    <div class="card">
        <div class="controls">
            <label><input type="checkbox" id="eveToggle"> <b>미토스 AI(Eve) 개입</b></label>
            <button onclick="runSimulation()">시뮬레이션 시작 (100개 광자 발송)</button>
        </div>
    </div>

    <div class="grid">
        <div class="box">
            <h3>Alice (송신)</h3>
            <p>비밀 키 생성 및<br>양자 상태 발송</p>
        </div>
        <div class="box" style="border-color: #f43f5e;">
            <h3>Eve (미토스 AI)</h3>
            <p id="eveStatus">대기 중...</p>
        </div>
        <div class="box">
            <h3>Bob (수신)</h3>
            <p>양자 상태 측정 및<br>필터 대조</p>
        </div>
    </div>

    <div class="card" style="margin-top: 20px;">
        <h2>📝 실시간 로그 및 결과 분석</h2>
        <div id="log" class="log-area">상단 버튼을 눌러 시뮬레이션을 시작하세요...</div>
        <div class="grid" style="margin-top: 20px;">
            <div>필터 일치 비트 수: <span id="keyLen" class="stat">0</span></div>
            <div>에러율(BER): <span id="errorRate" class="stat">0</span>%</div>
            <div id="securityStatus" style="font-weight: bold;"></div>
        </div>
    </div>
</div>

<script>
    function runSimulation() {
        const isEvePresent = document.getElementById('eveToggle').checked;
        const log = document.getElementById('log');
        const eveStatus = document.getElementById('eveStatus');
        log.innerHTML = "시뮬레이션 가동 중...\n";
        
        let rawBits = 100;
        let finalKeyAlice = "";
        let finalKeyBob = "";
        let errorCount = 0;
        let matchedFilters = 0;

        for (let i = 0; i < rawBits; i++) {
            // 1. Alice가 비트와 필터를 무작위 생성
            let aBit = Math.floor(Math.random() * 2);
            let aFilter = Math.random() < 0.5 ? '+' : 'x';

            // 2. Eve (Mythos AI)의 관측
            let currentBit = aBit;
            if (isEvePresent) {
                eveStatus.innerText = "⚠️ 관측 중 (상태 붕괴 발생)";
                let eFilter = Math.random() < 0.5 ? '+' : 'x';
                if (eFilter !== aFilter) {
                    currentBit = Math.floor(Math.random() * 2); // 관측으로 인한 상태 붕괴
                }
            } else {
                eveStatus.innerText = "💤 수동적 대기 중";
            }

            // 3. Bob의 측정
            let bFilter = Math.random() < 0.5 ? '+' : 'x';
            let bBit = currentBit;
            if (bFilter !== aFilter) {
                bBit = Math.floor(Math.random() * 2); // 필터가 다르면 50% 확률
            }

            // 4. 필터 대조 (키 생성)
            if (aFilter === bFilter) {
                matchedFilters++;
                finalKeyAlice += aBit;
                finalKeyBob += bBit;
                if (aBit !== bBit) errorCount++;
            }
        }

        const errorRate = ((errorCount / matchedFilters) * 100).toFixed(1);
        
        // 로그 출력
        log.innerHTML += `전송된 총 광자: ${rawBits}개\n`;
        log.innerHTML += `필터 일치(키 후보): ${matchedFilters}개\n`;
        log.innerHTML += `추출된 키(Alice): ${finalKeyAlice.substring(0, 30)}...\n`;
        log.innerHTML += `추출된 키(Bob):   ${finalKeyBob.substring(0, 30)}...\n`;
        log.innerHTML += `감지된 에러 수: ${errorCount}개\n`;

        // 결과 업데이트
        document.getElementById('keyLen').innerText = matchedFilters;
        document.getElementById('errorRate').innerText = errorRate;
        const status = document.getElementById('securityStatus');
        
        if (isEvePresent && errorRate > 15) {
            status.innerHTML = "<span class='error'>🚫 해킹 감지! 미토스 AI 침입 확인</span>";
            status.style.color = "#f43f5e";
        } else if (!isEvePresent && errorRate < 5) {
            status.innerHTML = "<span style='color: #deff9a;'>✅ 보안 안전 (양자 키 일치)</span>";
        } else {
            status.innerHTML = "통계적 오차 범위 내";
        }
    }
</script>

</body>
</html>
